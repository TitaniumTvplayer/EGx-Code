
name: Build EGX Code APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find latest ZIP and extract project
      - name: Extract Latest EGX Code Version
        shell: bash
        run: |
          set -e

          echo "Searching for EGX Code ZIP files..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p /tmp/egx-update

          unzip -oq "$ZIP_FILE" -d /tmp/egx-update

          SETTINGS_FILE=$(find /tmp/egx-update -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found!"
            exit 1
          fi

          echo "EGX Code project extracted successfully!"

      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Download Alexandria font
      - name: Download Alexandria Font
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets

          curl -fsSL \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/alexandria/Alexandria%5Bwght%5D.ttf" \
            -o app/src/main/assets/Alexandria.ttf

      # 6. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # 7. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGX-Code-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

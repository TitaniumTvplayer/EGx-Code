<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>البورصة المصرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"AlexandriaLocal";src:url("Alexandria.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{
  --bg:#f5f5f2;--card:#ffffff;--tx:#23272b;--mut:#7a8087;--bd:#ececea;--ac:#2f7d66;
  --pos:#1f7a52;--pos-bg:#e6f3ec;--neg:#b24a43;--neg-bg:#faeceb;--neu:#8a6a12;--neu-bg:#f7f1e0;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141719;--card:#1d2124;--tx:#e8eaec;--mut:#9aa1a8;--bd:#2a2f33;--ac:#4fb391;
  --pos:#5cc795;--pos-bg:#17302a;--neg:#e58a83;--neg-bg:#35201f;--neu:#dcbc62;--neu-bg:#332b16;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
body{margin:0;font-family:"AlexandriaLocal","Alexandria",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;font-size:15px}
.wrap{padding:18px 18px 56px;max-width:560px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin:4px 0 16px}
h2{font-size:14px;font-weight:600;color:var(--mut);margin:26px 0 10px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--neu)}.mut{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:26px;font-weight:700}
.big small{font-size:14px;font-weight:600;margin-inline-start:8px}
.tap{cursor:pointer}
.chip{padding:3px 12px;border-radius:999px;font-size:13px;white-space:nowrap;font-weight:600}
.chip.pos{background:var(--pos-bg);color:var(--pos)}
.chip.neg{background:var(--neg-bg);color:var(--neg)}
.chip.neu{background:var(--neu-bg);color:var(--neu)}
.search{display:flex;gap:8px;background:var(--card);border-radius:999px;padding:6px 6px 6px 6px;margin:14px 0 4px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font-size:16px;padding:8px 14px;outline:none}
.search button{border:0;border-radius:999px;background:var(--ac);color:#fff;padding:8px 20px;font-size:15px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:13px 16px;margin-bottom:8px;cursor:pointer}
.tk{font-weight:700;font-size:16px}
.sub{font-size:13px;color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.ghost{background:transparent;border:0;color:var(--ac);font-size:14px;padding:6px 2px}
.verdict{border-radius:20px;padding:18px 18px 16px;margin-bottom:14px}
.verdict.pos{background:var(--pos-bg);color:var(--pos)}
.verdict.neg{background:var(--neg-bg);color:var(--neg)}
.verdict.neu{background:var(--neu-bg);color:var(--neu)}
.verdict .vt{font-size:22px;font-weight:700}
.verdict .vh{font-size:14px;margin-top:4px;color:var(--tx);opacity:.8}
.priceRow{display:flex;align-items:baseline;gap:10px;margin:2px 2px 2px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0}
.kv+.kv{border-top:1px solid var(--bd)}
.kv span small{color:var(--mut);font-size:12px}
.kv b{font-weight:600;text-align:end}
.kv b small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.chips{display:flex;gap:8px;margin-bottom:6px}
.tg{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:999px;padding:4px 14px;font-size:13px}
.tg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chart{width:100%;height:auto;display:block;direction:ltr;margin:8px 0 4px}
.chart .grid{stroke:var(--bd);stroke-width:1}
.chart .dash{stroke:var(--bd);stroke-width:1;stroke-dasharray:3 3}
.chart .p{fill:none;stroke:var(--tx);stroke-width:1.8;stroke-linejoin:round}
.chart .m20{fill:none;stroke:#e0a100;stroke-width:1.3}
.chart .m50{fill:none;stroke:#3b82f6;stroke-width:1.3}
.chart .r{fill:none;stroke:var(--ac);stroke-width:1.5}
.chart .dot{fill:var(--tx)}
.chart .res{stroke:var(--neg);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.chart .sup{stroke:var(--pos);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.chart .fcl{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 2}
.chart .fcb{stroke:var(--ac);stroke-width:4;stroke-linecap:round;opacity:.4}
.chart .fcd{fill:var(--ac)}
.chart .lbl{fill:var(--mut);font-size:9px}
.chart .tr{text-anchor:end}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px}.leg span{white-space:nowrap}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"‹";float:left;color:var(--mut);transition:transform .15s}
details.card[open] summary::after{transform:rotate(-90deg)}
details.card ul{padding-inline-start:18px;margin:10px 0 0}
details.card li{margin:5px 0;font-size:14px}
details.card p{margin:10px 0 0;font-size:13px;color:var(--mut)}
.links{margin-top:6px}
.links a{color:var(--ac);margin-inline-end:16px;font-size:14px;text-decoration:none}
.foot{font-size:12px;color:var(--mut);margin-top:22px;text-align:center}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.field{width:100%;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;padding:10px 12px;font-size:15px}
.btn2{margin-top:10px;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:999px;padding:6px 14px;font-size:13px}
</style>
</head>
<body>

<div id="home" class="wrap">
  <h1>البورصة المصرية</h1>

  <div class="card tap" id="idx" data-sym="^CASE30"><span class="mut">جاري تحميل المؤشر العام…</span></div>

  <div class="search">
    <input id="sym" placeholder="ابحث عن سهم، مثلا COMI" autocapitalize="characters" autocomplete="off">
    <button id="go">ابحث</button>
  </div>

  <h2>أسهمي</h2>
  <div id="list"></div>

  <details class="card">
    <summary>إعدادات</summary>
    <label>مفتاح Oanor (اختياري، للسعر اللحظي)</label>
    <input class="field" id="okey" placeholder="oanor_live_..." autocomplete="off">
    <button class="btn2" id="reset">رجّع قايمة الأسهم الافتراضية</button>
  </details>

  <p class="foot">للمعلومات فقط، مش نصيحة مالية.</p>
</div>

<div id="page" class="wrap" hidden></div>

<script>
//#PURE
const sma=(a,n)=>a.length<n?null:a.slice(-n).reduce((x,y)=>x+y,0)/n;
function ema(a,n){const k=2/(n+1);const out=[];let e=a[0];for(let i=0;i<a.length;i++){e=i===0?a[0]:a[i]*k+e*(1-k);out.push(e)}return out}
function rsi(a,n=14){
  if(a.length<=n)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}
  g/=n;l/=n;
  for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l);
}
function macd(a){
  const e12=ema(a,12),e26=ema(a,26);
  const m=e12.map((x,i)=>x-e26[i]);
  const s=ema(m,9);
  const i=m.length-1;
  return{m:m[i],s:s[i],h:m[i]-s[i],hPrev:m[i-1]-s[i-1]};
}
function levels(rows){
  const r=rows.slice(-120),k=3,price=r[r.length-1].c,pts=[];
  for(let i=k;i<r.length-k;i++){
    let isH=true,isL=true;
    for(let j=i-k;j<=i+k;j++){
      if(j===i)continue;
      if(r[j].h>=r[i].h)isH=false;
      if(r[j].l<=r[i].l)isL=false;
    }
    if(isH)pts.push(r[i].h);
    if(isL)pts.push(r[i].l);
  }
  pts.sort((a,b)=>a-b);
  const cl=[];
  for(const p of pts){
    const c=cl[cl.length-1];
    if(c&&p/c.avg-1<0.015){c.sum+=p;c.n++;c.avg=c.sum/c.n}
    else cl.push({sum:p,n:1,avg:p});
  }
  const lv=cl.map(c=>c.avg);
  let res=lv.filter(v=>v>price*1.002).slice(0,2);
  let sup=lv.filter(v=>v<price*0.998).reverse().slice(0,2);
  const top=Math.max(...r.map(x=>x.h)),bot=Math.min(...r.map(x=>x.l));
  if(!res.length&&top>price*1.002)res=[top];
  if(!sup.length&&bot<price*0.998)sup=[bot];
  return{res,sup,price,atTop:!res.length,atBottom:!sup.length};
}
function forecast(rows,days=5){
  const c=rows.map(r=>r.c),n=20,y=c.slice(-n),last=c[c.length-1];
  const xm=(n-1)/2,ym=y.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(i-xm)*(y[i]-ym);den+=(i-xm)*(i-xm)}
  const slope=num/den;
  const rets=[];
  for(let i=c.length-n;i<c.length;i++)rets.push(Math.log(c[i]/c[i-1]));
  const m=rets.reduce((a,b)=>a+b,0)/rets.length;
  const sd=Math.sqrt(rets.reduce((a,b)=>a+(b-m)*(b-m),0)/(rets.length-1));
  const center=last+slope*days,band=last*sd*Math.sqrt(days);
  return{days,center,lo:center-band,hi:center+band,last};
}
function evaluate(rows){
  const closes=rows.map(r=>r.c);
  const last=rows[rows.length-1],prev=rows[rows.length-2];
  const R=rsi(closes),M=macd(closes),s20=sma(closes,20),s50=sma(closes,50);
  const vAvg=rows.slice(-21,-1).reduce((a,r)=>a+r.v,0)/20;
  const vr=vAvg>0?last.v/vAvg:null;
  const up=last.c>=prev.c;
  const checks=[];
  const f1=x=>Number(x).toFixed(1),f2=x=>Number(x).toFixed(2);
  if(R!=null){
    if(R>70)checks.push({s:-1,txt:`RSI = ${f1(R)}: تشبع شرائي (احتمال تصحيح)`});
    else if(R<30)checks.push({s:1,txt:`RSI = ${f1(R)}: تشبع بيعي (احتمال ارتداد)`});
    else checks.push({s:0,txt:`RSI = ${f1(R)}: في النطاق الطبيعي`});
  }
  checks.push(M.m>M.s
    ?{s:1,txt:`MACD فوق خط الإشارة${M.h>M.hPrev?' والزخم بيزيد':''}`}
    :{s:-1,txt:`MACD تحت خط الإشارة${M.h<M.hPrev?' والزخم بيضعف':''}`});
  if(s20!=null)checks.push(last.c>s20
    ?{s:1,txt:`السعر فوق متوسط 20 يوم (${f2(s20)})`}
    :{s:-1,txt:`السعر تحت متوسط 20 يوم (${f2(s20)})`});
  if(s20!=null&&s50!=null)checks.push(s20>s50
    ?{s:1,txt:`متوسط 20 فوق متوسط 50 (اتجاه صاعد)`}
    :{s:-1,txt:`متوسط 20 تحت متوسط 50 (اتجاه هابط)`});
  if(vr!=null){
    if(vr>1.5&&up)checks.push({s:1,txt:`حجم التداول ${f1(vr)}× المعتاد مع صعود`});
    else if(vr>1.5&&!up)checks.push({s:-1,txt:`حجم التداول ${f1(vr)}× المعتاد مع هبوط`});
    else checks.push({s:0,txt:`حجم التداول عادي (${f1(vr)}× المعتاد)`});
  }
  const lv=levels(rows),fc=forecast(rows);
  const nr=lv.res[0],ns=lv.sup[0];
  if(nr&&nr/last.c-1<0.02)checks.push({s:-1,txt:`السعر قريب من مقاومة (${f2(nr)})`});
  if(ns&&1-ns/last.c<0.02)checks.push({s:1,txt:`السعر قريب من دعم (${f2(ns)})`});
  const score=checks.reduce((a,c)=>a+c.s,0);
  let verdict;
  if(R!=null&&R>70)verdict={t:'السعر ممكن يصحح',i:'🔻',c:'neg',h:'السعر طلع بسرعة، ممكن ينزل شوية قبل ما يكمل'};
  else if(score>=3)verdict={t:'إشارة شراء',i:'✅',c:'pos',h:'أغلب المؤشرات في صالح الصعود'};
  else if(score<=-2&&R!=null&&R<30)verdict={t:'استنى شوية',i:'⏳',c:'neu',h:'السعر نازل بس ممكن يرتد، الأحسن تستنى تأكيد'};
  else if(score<=-2)verdict={t:'ما تشتريش دلوقتي',i:'⛔',c:'neg',h:'أغلب المؤشرات في صالح النزول'};
  else verdict={t:'استنى شوية',i:'⏳',c:'neu',h:'الإشارات مش واضحة أو متضاربة'};
  return{checks,score,verdict,lv,fc,chg:(last.c/prev.c-1)*100,lastC:last.c,date:new Date(last.t)};
}
function smaSeries(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function rsiSeries(a,n=14){
  const out=a.map(()=>null);
  if(a.length<=n)return out;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}
  g/=n;l/=n;
  out[n]=l===0?100:100-100/(1+g/l);
  for(let i=n+1;i<a.length;i++){
    const d=a[i]-a[i-1];
    g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;
    out[i]=l===0?100:100-100/(1+g/l);
  }
  return out;
}
function chartSvg(rows,lv,fc,o){
  o=o||{};
  const N=Math.min(90,rows.length),off=rows.length-N;
  const closes=rows.map(r=>r.c);
  const s20=smaSeries(closes,20),s50=smaSeries(closes,50),rs=rsiSeries(closes);
  const W=340,H1=170,H2=o.rsi?56:0,GAP=o.rsi?16:0,pad=14,total=H1+GAP+H2,plotW=W-44;
  const P=closes.slice(off),A=s20.slice(off),B=s50.slice(off),Rr=rs.slice(off);
  const vals=P.concat(o.ma?A.filter(v=>v!=null):[],o.ma?B.filter(v=>v!=null):[]);
  if(lv){lv.res.forEach(v=>vals.push(v));lv.sup.forEach(v=>vals.push(v))}
  if(fc){vals.push(fc.lo,fc.hi)}
  const lo=Math.min(...vals),hi=Math.max(...vals),rng=(hi-lo)||1;
  const x=i=>(i/(N-1))*plotW;
  const y=v=>pad+(1-(v-lo)/rng)*(H1-2*pad);
  const yr=v=>H1+GAP+(1-v/100)*H2;
  const path=(a,f)=>{let d='',open=false;a.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?'L':'M')+x(i).toFixed(1)+' '+f(v).toFixed(1)+' ';open=true});return d};
  const lastX=x(N-1),lastY=y(P[N-1]);
  let extra='';
  if(lv){
    lv.res.forEach(v=>{extra+=`<line class="res" x1="0" y1="${y(v).toFixed(1)}" x2="${plotW}" y2="${y(v).toFixed(1)}"/><text class="lbl tr" x="${plotW-2}" y="${(y(v)-2).toFixed(1)}">مقاومة ${v.toFixed(2)}</text>`});
    lv.sup.forEach(v=>{extra+=`<line class="sup" x1="0" y1="${y(v).toFixed(1)}" x2="${plotW}" y2="${y(v).toFixed(1)}"/><text class="lbl tr" x="${plotW-2}" y="${(y(v)+9).toFixed(1)}">دعم ${v.toFixed(2)}</text>`});
  }
  if(fc){
    const fx=W-8;
    extra+=`<line class="fcl" x1="${lastX.toFixed(1)}" y1="${lastY.toFixed(1)}" x2="${fx}" y2="${y(fc.center).toFixed(1)}"/><line class="fcb" x1="${fx}" y1="${y(fc.hi).toFixed(1)}" x2="${fx}" y2="${y(fc.lo).toFixed(1)}"/><circle class="fcd" cx="${fx}" cy="${y(fc.center).toFixed(1)}" r="3.5"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${total}" class="chart" role="img" aria-label="تشارت السعر">
<line class="grid" x1="0" y1="${y(hi).toFixed(1)}" x2="${W}" y2="${y(hi).toFixed(1)}"/>
<line class="grid" x1="0" y1="${y(lo).toFixed(1)}" x2="${W}" y2="${y(lo).toFixed(1)}"/>
<text class="lbl" x="2" y="${(y(hi)-2).toFixed(1)}">${hi.toFixed(2)}</text>
<text class="lbl" x="2" y="${(y(lo)+10).toFixed(1)}">${lo.toFixed(2)}</text>
${extra}
${o.ma?`<path class="m50" d="${path(B,y)}"/><path class="m20" d="${path(A,y)}"/>`:''}
<path class="p" d="${path(P,y)}"/>
<circle class="dot" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3"/>
${o.rsi?`<line class="dash" x1="0" y1="${yr(70).toFixed(1)}" x2="${W}" y2="${yr(70).toFixed(1)}"/><line class="dash" x1="0" y1="${yr(30).toFixed(1)}" x2="${W}" y2="${yr(30).toFixed(1)}"/><text class="lbl" x="2" y="${(yr(70)-2).toFixed(1)}">70</text><text class="lbl" x="2" y="${(yr(30)-2).toFixed(1)}">30</text><path class="r" d="${path(Rr,yr)}"/>`:''}
</svg>`;
}
//#ENDPURE

const DEFAULTS=['COMI','TMGH','ETEL','EAST','SWDY','HRHO','FWRY','ORAS','ABUK','EFIH'];
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const LRM='\u200E';
const sgn=n=>LRM+(n>=0?'+':'')+fmt(n)+'%'+LRM;
const clean=s=>(s||'').toUpperCase().replace(/\.CA$/,'').replace(/[^A-Z0-9]/g,'').slice(0,10);
const SHORT={'إشارة شراء':'شراء','استنى شوية':'استنى','ما تشتريش دلوقتي':'ما تشتريش','السعر ممكن يصحح':'هيصحح'};
const chip=v=>`<span class="chip ${v.c}">${v.i} ${SHORT[v.t]||v.t}</span>`;
let watch=store.get('watch',DEFAULTS);
let opts=store.get('opts',{ma:false,rsi:false});
let cur=null;
const cache={};

async function yahoo(sym){
  const s=sym.startsWith('^')?sym:sym+'.CA';
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(s)+'?range=6mo&interval=1d';
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const res=j.chart&&j.chart.result&&j.chart.result[0];
  if(!res)throw new Error('مفيش بيانات');
  const q=res.indicators.quote[0],ts=res.timestamp||[];
  const rows=[];
  for(let i=0;i<ts.length;i++){
    if(q.close[i]!=null)rows.push({t:ts[i]*1000,c:q.close[i],h:q.high[i]!=null?q.high[i]:q.close[i],l:q.low[i]!=null?q.low[i]:q.close[i],v:q.volume[i]||0});
  }
  return{meta:res.meta||{},rows};
}

async function oanorQuote(code){
  const key=store.get('okey','');
  if(!key)return null;
  try{
    const r=await fetch('https://api.oanor.com/egx-api/v1/quote?codes='+encodeURIComponent(code),{headers:{'x-oanor-key':key}});
    if(!r.ok)return null;
    const j=await r.json();
    return j.data&&j.data.quotes&&j.data.quotes[0]||null;
  }catch(e){return null}
}

async function analyze(sym){
  const isIndex=sym.startsWith('^');
  const{meta,rows}=await yahoo(sym);
  if(rows.length<35)throw new Error('بيانات قليلة');
  const e=evaluate(rows);
  let price=meta.regularMarketPrice!=null?meta.regularMarketPrice:e.lastC,chg=e.chg,live=false;
  if(!isIndex){
    const q=await oanorQuote(sym);
    if(q&&q.price){price=q.price;chg=q.change_percent!=null?q.change_percent:chg;live=true}
  }
  const stale=(Date.now()-e.date.getTime())>4*86400000;
  return{sym,isIndex,price,chg,live,stale,rows,lv:e.lv,fc:e.fc,date:e.date,checks:e.checks,score:e.score,verdict:e.verdict};
}

async function getA(sym,force){
  const c=cache[sym];
  if(!force&&c&&Date.now()-c.at<300000)return c.a;
  const a=await analyze(sym);
  cache[sym]={a,at:Date.now()};
  return a;
}

/* ---------- الشاشة الرئيسية ---------- */
function rowHtml(s,a){
  return `<div class="tk">${s}</div><div class="sub">${fmt(a.price)} <span class="${a.chg>=0?'pos':'neg'}">${sgn(a.chg)}</span></div>`;
}
function fillItem(s,a){
  const it=$('it-'+s);if(!it)return;
  it.innerHTML=`<div>${rowHtml(s,a)}</div>${chip(a.verdict)}`;
}
async function loadList(){
  $('list').innerHTML=watch.map(s=>`<div class="row2" data-sym="${s}" id="it-${s}"><div><div class="tk">${s}</div><div class="sub">جاري التحميل…</div></div></div>`).join('')||'<div class="mut">القايمة فاضية. ابحث عن سهم وأضفه.</div>';
  for(const s of watch){
    try{fillItem(s,await getA(s))}
    catch(e){const it=$('it-'+s);if(it)it.querySelector('.sub').textContent='تعذر التحميل'}
  }
}
async function loadIndex(){
  try{
    const a=await getA('^CASE30');
    $('idx').innerHTML=`<div class="top"><div><div class="mut">المؤشر العام EGX30</div><div class="big">${fmt(a.price,0)}<small class="${a.chg>=0?'pos':'neg'}">${sgn(a.chg)}</small></div></div>${chip(a.verdict)}</div>`;
  }catch(e){$('idx').innerHTML='<span class="mut">تعذر تحميل المؤشر العام دلوقتي.</span>'}
}

/* ---------- صفحة التفاصيل ---------- */
function legendHtml(){
  let h='<span style="color:var(--tx)">━ السعر</span><span style="color:var(--neg)">┄ سقف</span><span style="color:var(--pos)">┄ أرضية</span><span style="color:var(--ac)">● المتوقع</span>';
  if(opts.ma)h+='<span style="color:#e0a100">━ متوسط 20</span><span style="color:#3b82f6">━ متوسط 50</span>';
  if(opts.rsi)h+='<span style="color:var(--ac)">━ RSI (تحت)</span>';
  return `<div class="mut leg">${h}</div>`;
}
function chartBlock(a){return chartSvg(a.rows,a.lv,a.fc,opts)+legendHtml()}

function keysHtml(a){
  const p=a.lv.price,pc=v=>{const d=(v/p-1)*100;return '\u200E'+(d>=0?'+':'')+d.toFixed(1)+'%\u200E'};
  const r=a.lv.res[0],s=a.lv.sup[0],f=a.fc;
  return `<div class="card">
<div class="kv"><span>سقف قريب <small>(مقاومة)</small></span><b class="${r?'neg':''}">${r?fmt(r)+'<small>'+pc(r)+'</small>':'<small>مفيش، السعر عند أعلى مستوى في 6 شهور</small>'}</b></div>
<div class="kv"><span>أرضية قريبة <small>(دعم)</small></span><b class="${s?'pos':''}">${s?fmt(s)+'<small>'+pc(s)+'</small>':'<small>مفيش، السعر عند أقل مستوى في 6 شهور</small>'}</b></div>
<div class="kv"><span>المتوقع بعد ${f.days} أيام</span><b>${fmt(f.center)}<small>غالباً بين ${fmt(f.lo)} و${fmt(f.hi)}</small></b></div>
</div>`;
}

function pageHtml(a){
  const v=a.verdict,name=a.isIndex?'المؤشر العام EGX30':a.sym,inList=watch.includes(a.sym);
  const links=a.isIndex?'':`<div class="links"><a href="https://www.tradingview.com/symbols/EGX-${a.sym}/">TradingView</a><a href="https://www.investing.com/search/?q=${a.sym}">Investing</a></div>`;
  return `<div class="bar"><button class="ghost" id="back">→ رجوع</button><b>${name}</b>${a.isIndex?'<span></span>':`<button class="ghost" id="tog">${inList?'شيل من أسهمي':'أضف لأسهمي'}</button>`}</div>
<div class="verdict ${v.c}"><div class="vt">${v.i} ${v.t}</div><div class="vh">${v.h}</div></div>
<div class="priceRow"><span class="big">${fmt(a.price)}</span><span class="${a.chg>=0?'pos':'neg'}">${sgn(a.chg)}</span></div>
<div class="mut" style="margin-bottom:12px">${a.live?'سعر لحظي':'آخر إغلاق يومي'} · ${a.date.toLocaleDateString('ar-EG')}${a.stale?' ⚠️ البيانات قديمة':''}</div>
${keysHtml(a)}
<div class="card">
<div class="chips"><button class="tg ${opts.ma?'on':''}" data-tg="ma">متوسطات</button><button class="tg ${opts.rsi?'on':''}" data-tg="rsi">RSI</button></div>
<div id="chartBox">${chartBlock(a)}</div>
</div>
<details class="card"><summary>ليه الحكم ده؟</summary><ul>${a.checks.map(c=>`<li class="${c.s>0?'pos':c.s<0?'neg':'neu'}">${c.s>0?'▲':c.s<0?'▼':'●'} ${c.txt}</li>`).join('')}</ul></details>
<details class="card"><summary>ملاحظات مهمة</summary><p>الحكم تلخيص آلي للمؤشرات الفنية، مش توصية بالشراء أو البيع ولا نصيحة مالية.</p><p>المتوقع تقدير إحصائي لو اتجاه آخر 20 يوم كمل مع التذبذب المعتاد، مش توقع مضمون.</p><p>البيانات من Yahoo Finance (مصدر غير رسمي) وممكن تتأخر عن شاشة شركة الوساطة. راجع السعر منها قبل أي قرار.</p></details>
${links}`;
}

function showHome(){$('page').hidden=true;$('home').hidden=false;cur=null}

async function openDetail(sym,force){
  const pg=$('page');
  $('home').hidden=true;pg.hidden=false;window.scrollTo(0,0);
  if(!history.state||!history.state.d)history.pushState({d:1},'');
  pg.innerHTML='<div class="bar"><button class="ghost" id="back">→ رجوع</button><span></span><span></span></div><div class="mut">جاري التحليل…</div>';
  try{
    const a=await getA(sym,force);
    cur=a;
    pg.innerHTML=pageHtml(a);
  }catch(e){
    pg.innerHTML='<div class="bar"><button class="ghost" id="back">→ رجوع</button><span></span><span></span></div><div class="card neg">مقدرتش أجيب بيانات للكود ده ('+esc(e.message)+'). اتأكد من الكود أو جرب تاني.</div>';
  }
}

window.addEventListener('popstate',showHome);

$('page').addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('#back')){history.back();return}
  const tg=t.closest('[data-tg]');
  if(tg&&cur){
    const k=tg.dataset.tg;opts[k]=!opts[k];store.set('opts',opts);
    tg.classList.toggle('on',opts[k]);
    $('chartBox').innerHTML=chartBlock(cur);
    return;
  }
  if(t.closest('#tog')&&cur){
    const s=cur.sym;
    if(watch.includes(s))watch=watch.filter(x=>x!==s);else watch.push(s);
    store.set('watch',watch);
    $('tog').textContent=watch.includes(s)?'شيل من أسهمي':'أضف لأسهمي';
    loadList();
  }
});

$('home').addEventListener('click',ev=>{
  const it=ev.target.closest('[data-sym]');
  if(it)openDetail(it.dataset.sym,false);
});

$('go').onclick=()=>{
  const s=clean($('sym').value);
  if(!s)return;
  $('sym').blur();
  openDetail(s,true);
};
$('sym').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

$('okey').value=store.get('okey','');
$('okey').addEventListener('change',()=>{store.set('okey',$('okey').value.trim());for(const k in cache)delete cache[k]});
$('reset').onclick=()=>{watch=DEFAULTS.slice();store.set('watch',watch);loadList()};

loadIndex();
loadList();
</script>
</body>
</html>
